<!DOCTYPE html>
<!-- =========================================================================
     PATHFINDER — shared result page (what a QR code opens)
     URL: share.html?t=<token>   (backend: SHARE_BASE_URL=https://<site>/.../share.html?t={token})
     Reads GET /api/share/:token (public, no login) and shows the saved AI result.
     Everything from the API is inserted as text, never as HTML.
     ========================================================================= -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <meta name="robots" content="noindex">
  <title>PathFinder — ผลที่แชร์</title>
  <style>
    :root { --bg: #FAF9F6; --card: #FFFFFF; --ink: #1F3A3D; --muted: #5B6B6D; --line: #DCE3DF; --accent: #6B9080; --warn: #FCE9D9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141A1B; --card: #1C2426; --ink: #E7EEEC; --muted: #A3B2B0; --line: #2D3A3C; --accent: #8DB3A2; --warn: #4A3424; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Noto Sans Thai", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 20px 0 8px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 10px 0; }
    .note { background: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: .9rem; margin-top: 20px; }
    ul { margin: 6px 0; padding-left: 20px; }
    .k { font-weight: 600; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="muted">PathFinder • TCAS</p>
    <h1 id="title">กำลังโหลด…</h1>
    <p id="meta" class="muted"></p>
    <div id="content"></div>
    <p id="verify" class="note" hidden></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/share-page.js"></script>
</body>
</html>
