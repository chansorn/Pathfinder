name: backend-ci

# runs the backend test suite (mock AI + fake Supabase, no secrets needed)
on:
  push:
    paths: ['pathfinder-backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['pathfinder-backend/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathfinder-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathfinder-backend/package-lock.json
      - run: npm ci
      - run: npm test
